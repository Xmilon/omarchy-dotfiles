<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- JetBrains Mono everywhere: apps and web pages that ask for the default
     sans-serif, serif or system-ui font get JetBrains Mono (the IntelliJ
     editor font). Omarchy's own rules (50-omarchy.conf) turn sans-serif and
     serif into Liberation Sans / Serif before this file runs, so these rules
     put JetBrains Mono in front of those. Monospace already uses it. -->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>JetBrainsMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Liberation Serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>JetBrainsMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>JetBrainsMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>JetBrainsMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>JetBrainsMono Nerd Font</string></edit>
  </match>
</fontconfig>
