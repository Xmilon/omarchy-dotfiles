# Raw cava feed for the media widget (settings modelled on end-4/dots-hyprland):
# 48 mono bars, values 0-1000, 60 frames a second, read straight from PipeWire.
# Only runs while something is playing.
[general]
framerate = 60
bars = 48
autosens = 1
sleep_timer = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 20
