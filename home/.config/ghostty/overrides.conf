# Loaded after the Omarchy theme (see the end of config), so these win.

# Selection: slate blue with white text, the same as the command line's
# keyboard selection (ble.sh colour 60). background-opacity-cells makes it as
# translucent as the window.
selection-foreground = #ffffff
selection-background = #5f5f87

# A copy (Ctrl+C, or Ctrl+X cutting from the command line) clears the
# highlight, so no grey block is left behind.
selection-clear-on-copy = true
