# Loaded after the Omarchy theme (see the end of config), so these win.

# Selection: cool grey-blue glass behind the text; the text keeps its own
# colour. background-opacity-cells makes it as translucent as the window. The
# command line's keyboard selection uses the same tint (~/.blerc).
selection-foreground = cell-foreground
selection-background = #4b5266

# A copy (Ctrl+C, or Ctrl+X cutting from the command line) clears the
# highlight, so no grey block is left behind.
selection-clear-on-copy = true
