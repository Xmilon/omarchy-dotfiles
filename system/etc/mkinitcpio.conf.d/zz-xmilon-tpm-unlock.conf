# Xmilon: boot a systemd initramfs so the encrypted disk can be unlocked by the
# TPM (systemd-cryptenroll), with the password prompt as fallback.
# Sorts after Omarchy's drop-ins and converts their busybox hook line in place,
# so anything they add or remove is kept.
# Undo: delete this file, drop tpm2-device=auto from /etc/default/limine,
# run `sudo limine-mkinitcpio`.
_xmilon_hooks=()
for _xmilon_hook in "${HOOKS[@]}"; do
  case $_xmilon_hook in
    udev) _xmilon_hooks+=(systemd) ;;
    keymap) _xmilon_hooks+=(sd-vconsole) ;;
    consolefont | resume) ;;  # sd-vconsole / systemd cover these
    encrypt) _xmilon_hooks+=(sd-encrypt) ;;
    btrfs-overlayfs) _xmilon_hooks+=(sd-btrfs-overlayfs) ;;
    *) _xmilon_hooks+=("$_xmilon_hook") ;;
  esac
done
HOOKS=("${_xmilon_hooks[@]}")

# Faster boot with the NVIDIA driver: the kms hook makes autodetect pull in
# nouveau and its ~100 MB of firmware (it matches the NVIDIA card) although
# the proprietary driver is loaded early instead, and the firmware has to read
# the whole boot image while the screen is dark. Omarchy drops kms only on
# NVIDIA-only machines; this laptop drives every screen from the NVIDIA card
# (dGPU mode) too. The iGPU is NOT loaded early on purpose: loading amdgpu
# first renumbers the outputs (eDP-1 -> eDP-2, DP-1 -> DP-9).
if [[ " ${MODULES[*]:-} " == *" nvidia_drm "* ]]; then
  _xmilon_hooks=()
  for _xmilon_hook in "${HOOKS[@]}"; do
    [[ $_xmilon_hook == kms ]] || _xmilon_hooks+=("$_xmilon_hook")
  done
  HOOKS=("${_xmilon_hooks[@]}")
fi

# Boot screen matching the login: render its images before plymouth copies them.
_xmilon_hooks=()
for _xmilon_hook in "${HOOKS[@]}"; do
  [[ $_xmilon_hook == plymouth ]] && _xmilon_hooks+=(xmilon-plymouth)
  _xmilon_hooks+=("$_xmilon_hook")
done
HOOKS=("${_xmilon_hooks[@]}")
unset _xmilon_hooks _xmilon_hook
