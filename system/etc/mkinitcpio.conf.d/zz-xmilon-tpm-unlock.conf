# Xmilon: boot a systemd initramfs so the encrypted disk can be unlocked by the
# TPM (systemd-cryptenroll), with the password prompt as fallback.
# Sorts after Omarchy's drop-ins and converts their busybox hook line in place,
# so anything they add or remove is kept.
# Undo: delete this file, drop tpm2-device=auto from /etc/default/limine,
# run `sudo limine-mkinitcpio`.
_xmilon_hooks=()
for _xmilon_hook in "${HOOKS[@]}"; do
  case $_xmilon_hook in
    udev) _xmilon_hooks+=(systemd) ;;
    keymap) _xmilon_hooks+=(sd-vconsole) ;;
    consolefont | resume) ;;  # sd-vconsole / systemd cover these
    encrypt) _xmilon_hooks+=(sd-encrypt) ;;
    btrfs-overlayfs) _xmilon_hooks+=(sd-btrfs-overlayfs) ;;
    *) _xmilon_hooks+=("$_xmilon_hook") ;;
  esac
done
HOOKS=("${_xmilon_hooks[@]}")

# Faster boot on hybrid NVIDIA laptops: the kms hook pulls in nouveau and its
# ~100 MB of firmware (autodetect matches the NVIDIA card) although the
# proprietary driver is loaded early instead, and the firmware has to read the
# whole boot image while the screen is dark. Omarchy already drops kms on
# NVIDIA-only machines; here it is dropped on hybrids too and the iGPU's own
# driver is loaded early instead, so the laptop panel keeps early graphics.
if [[ " ${MODULES[*]:-} " == *" nvidia_drm "* && " ${HOOKS[*]} " == *" kms "* ]]; then
  _xmilon_igpu=()
  for _xmilon_pci in /sys/bus/pci/devices/*; do
    [[ -r $_xmilon_pci/class && -r $_xmilon_pci/vendor ]] || continue
    [[ $(<"$_xmilon_pci/class") == 0x03* && $(<"$_xmilon_pci/vendor") != 0x10de ]] || continue
    _xmilon_driver=$(basename "$(readlink -f "$_xmilon_pci/driver" 2>/dev/null)")
    case $_xmilon_driver in
      amdgpu | i915 | xe) _xmilon_igpu+=("$_xmilon_driver") ;;
      *) _xmilon_igpu=(unknown); break ;;
    esac
  done
  if (( ${#_xmilon_igpu[@]} > 0 )) && [[ ${_xmilon_igpu[0]} != unknown ]]; then
    MODULES+=("${_xmilon_igpu[@]}")
    _xmilon_hooks=()
    for _xmilon_hook in "${HOOKS[@]}"; do
      [[ $_xmilon_hook == kms ]] || _xmilon_hooks+=("$_xmilon_hook")
    done
    HOOKS=("${_xmilon_hooks[@]}")
  fi
  unset _xmilon_igpu _xmilon_pci _xmilon_driver
fi
unset _xmilon_hooks _xmilon_hook
