# Loaded after Omarchy's sddm.conf.d files, so these win.
# The disk-password boot screen (Plymouth theme "xmilon", styled like this
# login) is the only login: Omarchy's autologin.conf logs straight in after it.
# The Thyx login still shows after logging out.
[Theme]
Current=thyx

# Login screen only on the external monitor when one is plugged in.
[Wayland]
CompositorCommand=start-hyprland -- --config /usr/local/share/xmilon/sddm-hyprland.lua
